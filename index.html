<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Kvízová tabulka PRO v2.2+</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 20px;
}

input[type="number"],
input[type="text"],
input[type="date"] {
    margin: 2px;
}

#quizDesc {
    width: 300px;
}

.mobile input[type="number"],
.mobile input[type="text"],
.mobile input[type="date"] {
    font-size: 16px;
}

#results,
#rounds table {
    border: 3px solid black;
    border-collapse: collapse;
    width: 100%;
    margin-top: 20px;
    table-layout: fixed;
}

#rounds {
    overflow-x: auto;
}

#results th, #results td,
#rounds th, #rounds td {
    border: 1px solid black;
    padding: 4px;
    text-align: center;
    font-weight: bold;
    position: relative;
    vertical-align: middle;
}

#results th {
    background-color: #eee;
}

tr:nth-child(even) {
    background-color: #f2f2f2;
}

.total {
    background-color: #d0d0d0;
}

.col-rank { width: 75px; }
.col-players { width: 65px; }
.col-team { width: 160px; }

button {
    margin: 10px 5px;
    padding: 8px 12px;
}

.roundHeader {
    cursor: pointer;
    user-select: none;
}

.locked {
    background: #ddd;
}

.activeRound {
    background: #fff3b0 !important;
}

.roundCellWrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
}

.scoreInput {
    width: 52px;
    text-align: center;
}

.mobile .scoreInput {
    width: 66px;
    font-size: 16px;
}

.controlRow {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    flex-wrap: wrap;
    font-size: 10px;
    line-height: 1.1;
}

.mobile .controlRow {
    font-size: 12px;
}

.labelGreen {
    color: green;
}

.labelBlue {
    color: #1d4ed8;
}

.toggleBtn {
    border: 1px solid #888;
    background: white;
    color: #222;
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 10px;
    font-weight: bold;
    cursor: pointer;
    margin: 0;
    min-width: 0;
    line-height: 1.1;
}

.mobile .toggleBtn {
    font-size: 12px;
    padding: 3px 7px;
}

.toggleBtn.green.active {
    background: #22c55e;
    border-color: #16a34a;
    color: white;
}

.toggleBtn.blue.active {
    background: #2563eb;
    border-color: #1d4ed8;
    color: white;
}

.toggleBtn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.scoreCell {
    min-height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.mainScore {
    font-size: 16px;
    font-weight: bold;
}

.badges {
    position: absolute;
    right: 4px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 2px;
}

.badge {
    border-radius: 4px;
    padding: 1px 5px;
    font-size: 14px;
    font-weight: bold;
    line-height: 1.1;
    color: white;
    white-space: nowrap;
}

.badgeGreen {
    background: #16a34a;
}

.badgeBlue {
    background: #2563eb;
}

#bigTable {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    overflow: auto;
    display: none;
    padding: 20px;
    box-sizing: border-box;
    z-index: 9999;
}

#bigTable table {
    font-size: 26px;
}

.mobile #bigTable table {
    font-size: 22px;
}

#evaluationTable {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: white;
    overflow: auto;
    display: none;
    padding: 20px;
    box-sizing: border-box;
    z-index: 10000;
}

#evaluationControls {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

#evaluationInfo {
    font-weight: bold;
    font-size: 18px;
}

#evaluationContent table {
    border: 3px solid black;
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
    font-size: 26px;
}

.mobile #evaluationContent table {
    font-size: 22px;
}

#evaluationContent th,
#evaluationContent td {
    border: 1px solid black;
    padding: 4px;
    text-align: center;
    font-weight: bold;
    position: relative;
    vertical-align: middle;
}

#evaluationContent th {
    background-color: #eee;
}


#svetaciOverlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.92);
    color: gold;
    display: none;
    align-items: center;
    justify-content: center;
    text-align: center;
    z-index: 20000;
    padding: 30px;
    box-sizing: border-box;
    cursor: pointer;
}

#svetaciOverlayBox {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 34px;
    width: 100%;
}

.svetaciOverlayIcon {
    font-size: 92px;
    line-height: 1;
    filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.65));
    flex: 0 0 auto;
}

#svetaciOverlayMessage {
    font-size: 60px;
    font-weight: bold;
    line-height: 1.2;
    text-shadow: 0 0 14px rgba(255, 215, 0, 0.65);
}

#svetaciOverlayHint {
    margin-top: 30px;
    font-size: 18px;
    color: #ddd;
    font-weight: normal;
}

.mobile #svetaciOverlayBox {
    gap: 14px;
}

.mobile .svetaciOverlayIcon {
    font-size: 48px;
}

.mobile #svetaciOverlayMessage {
    font-size: 38px;
}

.mobile #svetaciOverlayHint {
    font-size: 14px;
}

</style>
</head>

<body>

<h2>Nastavení kvízu</h2>

<label>Datum: </label>
<input type="date" id="quizDate"><br>

<label>Popis: </label>
<input type="text" id="quizDesc"><br><br>

<h2>Nastavení týmů</h2>

<label>Počet týmů: </label>
<input type="number" id="teamCount" min="1">

<button onclick="createTeams()">Vytvořit týmy</button>

<br>

<label>
📱 Mobilní režim
<input type="checkbox" onchange="toggleMobile(this)">
</label>

<div id="teams"></div>

<h2>Zadání výsledků</h2>

<div id="rounds"></div>

<h2>Výsledky</h2>

<button onclick="openBigTable()">Zvětšit tabulku</button>
<button onclick="openEvaluation()">Vyhodnocení</button>
<button onclick="exportImage()">Export PNG</button>

<table id="results">
<thead></thead>
<tbody></tbody>
</table>

<div id="bigTable">
<button onclick="closeBigTable()">Zavřít</button>
<div id="bigContent"></div>
</div>

<div id="evaluationTable" tabindex="-1">
<div id="evaluationControls">
<button onclick="closeEvaluation()">Zavřít</button>
<button onclick="revealNextEvaluationTeam()">Odhalit další tým</button>
<button onclick="revealAllEvaluationTeams()">Odhalit vše</button>
<span id="evaluationInfo">Odhaleno 0 / 0</span>
</div>
<div id="evaluationContent"></div>
</div>

<div id="svetaciOverlay" onclick="hideSvetaciOverlay()">
    <div>
        <div id="svetaciOverlayBox">
            <div class="svetaciOverlayIcon" id="svetaciOverlayIconLeft">🏆</div>
            <div id="svetaciOverlayMessage"></div>
            <div class="svetaciOverlayIcon" id="svetaciOverlayIconRight">🏆</div>
        </div>
        <div id="svetaciOverlayHint">(5 sekund drží hláška)</div>
    </div>
</div>

<script>

let teams = [];
let rounds = 5;
let activeRound = null;

function toggleMobile(el) {
    document.body.classList.toggle('mobile', el.checked);
}

function createTeams() {

    const count = parseInt(document.getElementById('teamCount').value, 10);

    if (!count || count < 1) {
        alert('Zadej počet týmů');
        return;
    }

    const container = document.getElementById('teams');

    let html = '';

    for (let i = 0; i < count; i++) {

        html += `
            Tým ${i + 1}:
            <input type="text" id="team_${i}">
            hráči:
            <input type="number" value="1" min="1" id="players_${i}">
            <br>
        `;
    }

    html += '<button onclick="startQuiz()">Začít kvíz</button>';

    container.innerHTML = html;
}

function startQuiz() {

    teams = [];

    const count = parseInt(document.getElementById('teamCount').value, 10);

    for (let i = 0; i < count; i++) {

        teams.push({
            name: document.getElementById(`team_${i}`).value.trim() || `Tým ${i + 1}`,
            players: Math.max(1, parseInt(document.getElementById(`players_${i}`).value, 10) || 1),
            scores: Array(rounds).fill(0),
            total: 0,
            tipTotal: 0
        });
    }

    createRounds();
    updateTable();
}

function createRounds() {

    let html = `
        <table>
        <tr>
        <th class="col-team">Tým</th>
        <th class="col-players">Hráči</th>
    `;

    for (let r = 0; r < rounds; r++) {

        html += `
            <th id="head_${r}" class="roundHeader locked" onclick="toggleRound(${r})">
                ${r + 1}. kolo
            </th>
        `;
    }

    html += '</tr>';

    teams.forEach((team, i) => {

        html += `<tr><td>${team.name}</td><td>${team.players}</td>`;

        for (let r = 0; r < rounds; r++) {

            html += `
            <td>

                <div class="roundCellWrap">

                    <input
                        type="number"
                        min="0"
                        max="10"
                        class="scoreInput"
                        disabled
                        id="score_${i}_${r}"
                        onkeydown="handleEnter(event)"
                        oninput="validateScore(this); calculateScores()"
                    >

                    <div class="controlRow">

                        <span class="labelGreen">Bonus</span>

                        <button type="button" class="toggleBtn green"
                            id="bonus05_${i}_${r}"
                            onclick="toggleBonus(${i}, ${r}, '05')"
                            disabled>
                            +0,5
                        </button>

                        <button type="button" class="toggleBtn green"
                            id="bonus1_${i}_${r}"
                            onclick="toggleBonus(${i}, ${r}, '1')"
                            disabled>
                            +1
                        </button>

                        <button type="button" class="toggleBtn green"
                            id="bonus2_${i}_${r}"
                            onclick="toggleBonus(${i}, ${r}, '2')"
                            disabled>
                            +2
                        </button>

                    </div>

                    <div class="controlRow">

                        <span class="labelBlue">Tipovačka</span>

                        <button type="button"
                            class="toggleBtn blue"
                            id="tip_${i}_${r}"
                            onclick="handleTip(${i}, ${r})"
                            disabled>
                            TIP
                        </button>

                    </div>

                </div>

            </td>
            `;
        }

        html += '</tr>';
    });

    html += '</table>';

    document.getElementById('rounds').innerHTML = html;
}

function toggleRound(r) {

    activeRound = r;

    for (let x = 0; x < rounds; x++) {

        const locked = x !== r;

        teams.forEach((_, i) => {

            document.getElementById(`score_${i}_${x}`).disabled = locked;
            document.getElementById(`bonus05_${i}_${x}`).disabled = locked;
            document.getElementById(`bonus1_${i}_${x}`).disabled = locked;
            document.getElementById(`bonus2_${i}_${x}`).disabled = locked;
            document.getElementById(`tip_${i}_${x}`).disabled = locked;
        });

        const head = document.getElementById(`head_${x}`);

        head.classList.toggle('locked', locked);
        head.classList.toggle('activeRound', !locked);
    }
}

function handleEnter(e) {

    if (e.key !== 'Enter') return;

    const parts = e.target.id.split('_');

    const i = parseInt(parts[1], 10);
    const r = parseInt(parts[2], 10);

    if (r !== activeRound) return;

    e.preventDefault();

    const next = document.getElementById(`score_${i + 1}_${r}`);

    if (next) next.focus();
}

function validateScore(el) {

    let value = parseFloat(el.value);

    if (isNaN(value)) return;

    if (value < 0) el.value = 0;
    if (value > 10) el.value = 10;
}

function toggleBonus(teamIndex, roundIndex, type) {

    if (roundIndex !== activeRound) return;

    const btn = document.getElementById(`bonus${type}_${teamIndex}_${roundIndex}`);

    btn.classList.toggle('active');

    calculateScores();
}

function handleTip(teamIndex, roundIndex) {

    if (roundIndex !== activeRound) return;

    const clicked = document.getElementById(`tip_${teamIndex}_${roundIndex}`);

    clicked.classList.toggle('active');

    calculateScores();
}

function hasTip(i, r) {

    return document
        .getElementById(`tip_${i}_${r}`)
        ?.classList.contains('active') || false;
}

function getBonus(i, r) {

    let sum = 0;

    if (document.getElementById(`bonus05_${i}_${r}`)?.classList.contains('active')) sum += 0.5;
    if (document.getElementById(`bonus1_${i}_${r}`)?.classList.contains('active')) sum += 1;
    if (document.getElementById(`bonus2_${i}_${r}`)?.classList.contains('active')) sum += 2;

    return sum;
}

function formatNumberCs(value) {

    if (Number.isInteger(value)) return String(value);

    return String(value).replace('.', ',');
}

function formatDate(d) {

    if (!d) return '-';

    const date = new Date(d);

    const day = String(date.getDate()).padStart(2, '0');
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const year = date.getFullYear();

    return `${day}.${month}.${year}`;
}

function calculateScores() {

    teams.forEach((team, i) => {

        let sum = 0;
        let tips = 0;

        for (let r = 0; r < rounds; r++) {

            let base = parseFloat(document.getElementById(`score_${i}_${r}`).value);

            if (isNaN(base)) base = 0;

            const bonus = getBonus(i, r);
            const tip = hasTip(i, r) ? 1 : 0;

            const roundTotal = base + bonus + tip;

            team.scores[r] = roundTotal;

            sum += roundTotal;

            tips += tip;
        }

        team.total = sum;
        team.tipTotal = tips;
    });

    updateTable();
}

function updateTable() {

    const enriched = teams.map((team, i) => {

        let baseTotal = 0;
        let maxRound = 0;

        for (let r = 0; r < rounds; r++) {

            let base = parseFloat(document.getElementById(`score_${i}_${r}`)?.value);

            if (isNaN(base)) base = 0;

            baseTotal += base;

            if (base > maxRound) {
                maxRound = base;
            }
        }

        return {
            ...team,
            baseTotal,
            maxRound,
            originalIndex: i
        };
    });

    enriched.sort((a, b) => {

        if (b.total !== a.total) return b.total - a.total;
        if (b.baseTotal !== a.baseTotal) return b.baseTotal - a.baseTotal;
        if (a.players !== b.players) return a.players - b.players;
        if (b.maxRound !== a.maxRound) return b.maxRound - a.maxRound;

        return 0;
    });

    const date = formatDate(document.getElementById('quizDate').value);
    const desc = document.getElementById('quizDesc').value || '-';

    let head = `
        <tr>
            <th colspan="${rounds + 5}">${desc}</th>
        </tr>

        <tr>
            <th colspan="${rounds + 5}">
                Datum: ${date}
            </th>
        </tr>

        <tr>
            <th class="col-rank">Pořadí</th>
            <th class="col-team">Tým</th>
            <th class="col-players">Hráči</th>
    `;

    for (let r = 0; r < rounds; r++) {
        head += `<th>${r + 1}. kolo</th>`;
    }

    head += `
        <th>Tipovačky</th>
        <th>Celkem</th>
        </tr>
    `;

    document.querySelector('#results thead').innerHTML = head;

    let body = '';
    let lastKey = null;
    let lastRank = 0;

    enriched.forEach((team, i) => {

        const key = `${team.total}|${team.baseTotal}|${team.players}|${team.maxRound}`;

        let rank;

        if (i === 0) {
            rank = 1;
        } else if (i === 1 && key === lastKey) {
            rank = 2;
        } else if (key === lastKey && lastRank > 1) {
            rank = lastRank;
        } else {
            rank = i + 1;
        }

        lastKey = key;
        lastRank = rank;

        const realIndex = team.originalIndex;

        let row = `
            <tr>
                <td>${rank}.</td>
                <td>${team.name}</td>
                <td>${team.players}</td>
        `;

        for (let r = 0; r < rounds; r++) {

            let base = parseFloat(document.getElementById(`score_${realIndex}_${r}`).value);

            if (isNaN(base)) base = 0;

            const bonus = getBonus(realIndex, r);
            const tip = hasTip(realIndex, r) ? 1 : 0;

            const mainScore = base + tip;

            let badges = '';

            if (bonus > 0) {
                badges += `<span class="badge badgeGreen">+${formatNumberCs(bonus)}</span>`;
            }

            if (tip > 0) {
                badges += `<span class="badge badgeBlue">TIP</span>`;
            }

            row += `
                <td>

                    <div class="scoreCell">
                        <span class="mainScore">
                            ${formatNumberCs(mainScore)}
                        </span>
                    </div>

                    <div class="badges">
                        ${badges}
                    </div>

                </td>
            `;
        }

        row += `
            <td>${team.tipTotal}</td>
            <td class="total">${formatNumberCs(team.total)}</td>
            </tr>
        `;

        body += row;
    });

    document.querySelector('#results tbody').innerHTML = body;
}

function openBigTable() {

    document.getElementById('bigContent').innerHTML =
        document.getElementById('results').outerHTML;

    document.getElementById('bigTable').style.display = 'block';
}

function closeBigTable() {

    document.getElementById('bigTable').style.display = 'none';
}


let evaluationRows = [];
let evaluationRevealed = 0;
let evaluationPlayedRounds = 0;

function getPlayedRoundsCount() {

    let played = 0;

    for (let r = 0; r < rounds; r++) {

        let hasScore = false;

        for (let i = 0; i < teams.length; i++) {

            const input = document.getElementById(`score_${i}_${r}`);

            if (input && input.value !== '') {
                hasScore = true;
                break;
            }
        }

        if (!hasScore) break;

        played++;
    }

    return played;
}

function buildEvaluationRows(playedRounds) {

    const enriched = teams.map((team, i) => {

        let total = 0;
        let baseTotal = 0;
        let maxRound = 0;
        let tipTotal = 0;
        let roundData = [];

        for (let r = 0; r < playedRounds; r++) {

            let base = parseFloat(document.getElementById(`score_${i}_${r}`)?.value);

            if (isNaN(base)) base = 0;

            const bonus = getBonus(i, r);
            const tip = hasTip(i, r) ? 1 : 0;
            const roundTotal = base + bonus + tip;
            const mainScore = base + tip;

            baseTotal += base;
            total += roundTotal;
            tipTotal += tip;

            if (base > maxRound) {
                maxRound = base;
            }

            roundData.push({
                base,
                bonus,
                tip,
                mainScore,
                roundTotal
            });
        }

        return {
            name: team.name,
            players: team.players,
            total,
            baseTotal,
            maxRound,
            tipTotal,
            roundData,
            originalIndex: i
        };
    });

    enriched.sort((a, b) => {

        if (b.total !== a.total) return b.total - a.total;
        if (b.baseTotal !== a.baseTotal) return b.baseTotal - a.baseTotal;
        if (a.players !== b.players) return a.players - b.players;
        if (b.maxRound !== a.maxRound) return b.maxRound - a.maxRound;

        return 0;
    });

    let lastKey = null;
    let lastRank = 0;

    return enriched.map((team, i) => {

        const key = `${team.total}|${team.baseTotal}|${team.players}|${team.maxRound}`;

        let rank;

        if (i === 0) {
            rank = 1;
        } else if (i === 1 && key === lastKey) {
            rank = 2;
        } else if (key === lastKey && lastRank > 1) {
            rank = lastRank;
        } else {
            rank = i + 1;
        }

        lastKey = key;
        lastRank = rank;

        return {
            ...team,
            rank
        };
    });
}

function openEvaluation() {

    if (teams.length === 0) {
        alert('Nejdřív začni kvíz');
        return;
    }

    evaluationPlayedRounds = getPlayedRoundsCount();

    if (evaluationPlayedRounds === 0) {
        alert('Zatím není odehrané žádné kolo');
        return;
    }

    evaluationRows = buildEvaluationRows(evaluationPlayedRounds);
    evaluationRevealed = 0;

    document.getElementById('evaluationTable').style.display = 'block';
    document.getElementById('evaluationTable').focus();

    renderEvaluationTable();
}

function closeEvaluation() {

    document.getElementById('evaluationTable').style.display = 'none';
}

function revealNextEvaluationTeam() {

    if (evaluationRevealed < evaluationRows.length) {
        evaluationRevealed++;
        renderEvaluationTable();
        checkSvetaciSecretMessage();
    }
}

function revealAllEvaluationTeams() {

    evaluationRevealed = evaluationRows.length;
    renderEvaluationTable();
    checkSvetaciSecretMessage();
}

function renderEvaluationTable() {

    const date = formatDate(document.getElementById('quizDate').value);
    const desc = document.getElementById('quizDesc').value || '-';
    const colspan = evaluationPlayedRounds + 5;

    let html = `
        <table>
        <thead>
            <tr>
                <th colspan="${colspan}">${desc}</th>
            </tr>

            <tr>
                <th colspan="${colspan}">
                    Datum: ${date}
                </th>
            </tr>

            <tr>
                <th class="col-rank">Pořadí</th>
                <th class="col-team">Tým</th>
                <th class="col-players">Hráči</th>
    `;

    for (let r = 0; r < evaluationPlayedRounds; r++) {
        html += `<th>${r + 1}. kolo</th>`;
    }

    html += `
                <th>Tipovačky</th>
                <th>Celkem</th>
            </tr>
        </thead>
        <tbody>
    `;

    const visibleRows = evaluationRows.slice(evaluationRows.length - evaluationRevealed);

    visibleRows.forEach(team => {

        html += `
            <tr>
                <td>${team.rank}.</td>
                <td>${team.name}</td>
                <td>${team.players}</td>
        `;

        team.roundData.forEach(round => {

            let badges = '';

            if (round.bonus > 0) {
                badges += `<span class="badge badgeGreen">+${formatNumberCs(round.bonus)}</span>`;
            }

            if (round.tip > 0) {
                badges += `<span class="badge badgeBlue">TIP</span>`;
            }

            html += `
                <td>
                    <div class="scoreCell">
                        <span class="mainScore">
                            ${formatNumberCs(round.mainScore)}
                        </span>
                    </div>

                    <div class="badges">
                        ${badges}
                    </div>
                </td>
            `;
        });

        html += `
                <td>${team.tipTotal}</td>
                <td class="total">${formatNumberCs(team.total)}</td>
            </tr>
        `;
    });

    html += `
        </tbody>
        </table>
    `;

    document.getElementById('evaluationContent').innerHTML = html;
    document.getElementById('evaluationInfo').textContent =
        `Odhaleno ${evaluationRevealed} / ${evaluationRows.length}`;
}


let svetaciOverlayShownAt = 0;
let svetaciOverlayUnlockTimer = null;

function normalizeTeamName(name) {

    return String(name || '').trim().toLowerCase();
}

function showSvetaciOverlay(message, icon = '🏆') {

    svetaciOverlayShownAt = Date.now();

    if (svetaciOverlayUnlockTimer) {
        clearTimeout(svetaciOverlayUnlockTimer);
    }

    document.getElementById('svetaciOverlayMessage').innerHTML = message;
    document.getElementById('svetaciOverlayIconLeft').textContent = icon;
    document.getElementById('svetaciOverlayIconRight').textContent = icon;
    document.getElementById('svetaciOverlayHint').textContent = '(5 sekund drží hláška)';
    document.getElementById('svetaciOverlay').style.display = 'flex';

    svetaciOverlayUnlockTimer = setTimeout(() => {
        document.getElementById('svetaciOverlayHint').textContent = '(stiskni ESC)';
    }, 5000);
}

function canHideSvetaciOverlay() {

    return Date.now() - svetaciOverlayShownAt >= 5000;
}

function hideSvetaciOverlay() {

    if (!canHideSvetaciOverlay()) return;

    document.getElementById('svetaciOverlay').style.display = 'none';
}

function checkSvetaciSecretMessage() {

    if (evaluationRevealed !== evaluationRows.length) return;
    if (evaluationPlayedRounds !== rounds) return;

    const winner = evaluationRows[0];
    const svetaci = evaluationRows.find(team => normalizeTeamName(team.name) === 'světáci');

    if (svetaci) {

        if (normalizeTeamName(winner.name) === 'světáci') {
            showSvetaciOverlay('SVĚTÁCI JSOU NEJLEPŠÍ!', '🏆');
        } else {
            showSvetaciOverlay('NĚKDE SE STALA CHYBA VE VÝPOČTU.<br>SVĚTÁCI JSOU NEJLEPŠÍ!', '⚠️');
        }

    } else {

        showSvetaciOverlay('SVĚTÁCI JSOU STEJNĚ NEJLEPŠÍ!', '🏆');
    }
}

function isEvaluationVisible() {

    return document.getElementById('evaluationTable').style.display === 'block';
}

function isSvetaciOverlayVisible() {

    return document.getElementById('svetaciOverlay').style.display === 'flex';
}

document.addEventListener('keydown', function(e) {

    if (e.code === 'Escape' && isSvetaciOverlayVisible()) {
        e.preventDefault();
        hideSvetaciOverlay();
        return;
    }

    if (!isEvaluationVisible()) return;

    if (e.code === 'Space' || e.code === 'Enter') {
        e.preventDefault();
        revealNextEvaluationTeam();
    }

    if (e.code === 'Escape') {
        e.preventDefault();
        closeEvaluation();
    }
});

function exportImage() {

    html2canvas(document.getElementById('results'), {
        scale: window.devicePixelRatio * 2
    }).then(canvas => {

        const link = document.createElement('a');

        link.download = 'vysledky.png';

        link.href = canvas.toDataURL();

        link.click();
    });
}
